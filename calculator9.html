<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydrostatic Pressure Calculator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .calculator { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 520px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        a.back-btn { text-decoration: none; color: #2563eb; font-weight: bold; font-size: 14px; }
        select { padding: 5px 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; background: #fff; cursor: pointer; }
        h2 { text-align: center; color: #1e293b; font-size: 18px; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; color: #475569; font-weight: bold; font-size: 13px;}
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
        input:focus { border-color: #2563eb; outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .result-box { background: #f8fafc; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: center; border: 1px solid #e2e8f0; }
        .result-text { font-size: 15px; color: #334155; font-weight: bold; margin: 6px 0; }
        .highlight { color: #2563eb; font-size: 18px; }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="top-bar">
            <a href="index.html" class="back-btn" id="backText">← Back to Directory</a>
            <select id="langSelect" onchange="changeLanguage()">
                <option value="en">English 🇬🇧</option>
                <option value="fr">Français 🇫🇷</option>
                <option value="ar">العربية 🇸🇦</option>
            </select>
        </div>

        <h2 id="calcTitle">💧 Hydrostatic Pressure Calculator</h2>
        <div class="input-group">
            <label id="labelHeight">Liquid Height / Depth (meters):</label>
            <input type="number" id="pHeight" placeholder="e.g. 10" oninput="calculatePressure()">
        </div>
        <div class="input-group">
            <label id="labelDensity">Fluid Density (kg/m³, e.g., Water = 1000):</label>
            <input type="number" id="pDensity" value="1000" placeholder="1000" oninput="calculatePressure()">
        </div>
        
        <div class="result-box">
            <p class="result-text"><span id="textPressureKpa">Hydrostatic Pressure (kPa):</span> <span id="resKpa" class="highlight">0.00</span></p>
            <p class="result-text"><span id="textPressureBar">Hydrostatic Pressure (Bar):</span> <span id="resBar" class="highlight">0.00</span></p>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                backText: "← Back to Directory", calcTitle: "💧 Hydrostatic Pressure Calculator",
                labelHeight: "Liquid Height / Depth (meters):", labelDensity: "Fluid Density (kg/m³, e.g., Water = 1000):",
                textPressureKpa: "Hydrostatic Pressure (kPa):", textPressureBar: "Hydrostatic Pressure (Bar):", dir: "ltr"
            },
            fr: {
                backText: "← Retour au répertoire", calcTitle: "💧 Calculateur de Pression Hydrostatique",
                labelHeight: "Hauteur / Profondeur du Liquide (mètres) :", labelDensity: "Densité du Fluide (kg/m³, ex: Eau = 1000) :",
                textPressureKpa: "Pression Hydrostatique (kPa) :", textPressureBar: "Pression Hydrostatique (Bar) :", dir: "ltr"
            },
            ar: {
                backText: "← العودة إلى الدليل", calcTitle: "💧 حاسبة الضغط الهيدروستاتيكي",
                labelHeight: "ارتفاع أو عمق السائل (متر):", labelDensity: "كثافة السائل (كجم/م³، مثال: الماء = 1000):",
                textPressureKpa: "الضغط الهيدروستاتيكي (كيلوباسكال):", textPressureBar: "الضغط الهيدروستاتيكي (بار):", dir: "rtl"
            }
        };

        function changeLanguage() {
            let lang = document.getElementById('langSelect').value;
            let t = translations[lang];
            document.getElementById('htmlTag').setAttribute('lang', lang);
            document.getElementById('htmlTag').setAttribute('dir', t.dir);
            document.getElementById('backText').innerText = t.backText;
            document.getElementById('calcTitle').innerText = t.calcTitle;
            document.getElementById('labelHeight').innerText = t.labelHeight;
            document.getElementById('labelDensity').innerText = t.labelDensity;
            document.getElementById('textPressureKpa').innerText = t.textPressureKpa;
            document.getElementById('textPressureBar').innerText = t.textPressureBar;
        }

        function calculatePressure() {
            let h = parseFloat(document.getElementById('pHeight').value) || 0;
            let rho = parseFloat(document.getElementById('pDensity').value) || 1000;
            let g = 9.81; // تسارع الجاذبية الأرضية
            
            // الضغط P = rho * g * h (بالباسكال)
            let pressurePa = rho * g * h;
            let pressureKpa = pressurePa / 1000;
            let pressureBar = pressurePa / 100000;

            document.getElementById('resKpa').innerText = pressureKpa.toFixed(2);
            document.getElementById('resBar').innerText = pressureBar.toFixed(3);
        }
    </script>
</body>
</html>
