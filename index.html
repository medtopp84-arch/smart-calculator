<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الانحدار وفرق الارتفاع للأنابيب</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .calculator { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
        }
        h2 { text-align: center; color: #2c3e50; font-size: 22px; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #34495e; font-weight: bold; font-size: 14px;}
        input { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #bdc3c7; 
            border-radius: 6px; 
            font-size: 16px; 
            box-sizing: border-box; 
            transition: 0.3s; 
        }
        input:focus { border-color: #3498db; outline: none; box-shadow: 0 0 5px rgba(52, 152, 219, 0.3); }
        .result-box { 
            background: #e8f8f5; 
            padding: 15px; 
            border-radius: 6px; 
            margin-top: 20px; 
            text-align: center; 
            border: 1px solid #1abc9c; 
        }
        .result-text { font-size: 18px; color: #16a085; font-weight: bold; margin: 5px 0; }
    </style>
</head>
<body>

    <div class="calculator">
        <h2>📏 حاسبة فرق الارتفاع والانحدار</h2>
        
        <div class="input-group">
            <label>الارتفاع عند النقطة أ (متر):</label>
            <input type="number" id="elevA" placeholder="مثال: 150" oninput="calculate()">
        </div>
        
        <div class="input-group">
            <label>الارتفاع عند النقطة ب (متر):</label>
            <input type="number" id="elevB" placeholder="مثال: 111" oninput="calculate()">
        </div>
        
        <div class="input-group">
            <label>المسافة الأفقية بين النقطتين (متر):</label>
            <input type="number" id="distance" placeholder="مثال: 500" oninput="calculate()">
        </div>

        <div class="result-box">
            <p class="result-text">فرق الارتفاع (Dénivelée): <span id="deniveleeResult">0</span> متر</p>
            <p class="result-text">نسبة الانحدار (Pente): <span id="slopeResult">0</span> %</p>
        </div>
    </div>

    <script>
        function calculate() {
            // جلب الأرقام التي يكتبها المستخدم
            let elevA = parseFloat(document.getElementById('elevA').value) || 0;
            let elevB = parseFloat(document.getElementById('elevB').value) || 0;
            let distance = parseFloat(document.getElementById('distance').value) || 0;

            // حساب فرق الارتفاع
            let denivelee = Math.abs(elevA - elevB);
            document.getElementById('deniveleeResult').innerText = denivelee.toFixed(2);

            // حساب نسبة الانحدار
            if (distance > 0) {
                let slope = (denivelee / distance) * 100;
                document.getElementById('slopeResult').innerText = slope.toFixed(2);
            } else {
                document.getElementById('slopeResult').innerText = "0";
            }
        }
    </script>

</body>
</html>
