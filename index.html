<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">حاسبة الانحدار وفرق الارتفاع للأنابيب</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }
        .calculator { 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 450px; 
        }
        .lang-selector {
            text-align: left;
            margin-bottom: 15px;
        }
        select {
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #bdc3c7;
            font-size: 14px;
            background: #fff;
            cursor: pointer;
        }
        h2 { text-align: center; color: #2c3e50; font-size: 20px; margin-bottom: 20px; }
        .input-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; color: #34495e; font-weight: bold; font-size: 13px;}
        input, textarea { 
            width: 100%; 
            padding: 9px; 
            border: 1px solid #bdc3c7; 
            border-radius: 6px; 
            font-size: 15px; 
            box-sizing: border-box; 
            transition: 0.3s; 
        }
        input:focus, textarea:focus { border-color: #3498db; outline: none; box-shadow: 0 0 5px rgba(52, 152, 219, 0.3); }
        .result-box { 
            background: #e8f8f5; 
            padding: 12px; 
            border-radius: 6px; 
            margin-top: 15px; 
            text-align: center; 
            border: 1px solid #1abc9c; 
        }
        .result-text { font-size: 15px; color: #16a085; font-weight: bold; margin: 5px 0; }
        .ai-section {
            margin-top: 20px;
            border-top: 1px solid #ecf0f1;
            padding-top: 15px;
        }
        button.ai-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button.ai-btn:hover { background-color: #2980b9; }
        .ai-response {
            background: #f8f9f9;
            border: 1px solid #bdc3c7;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 14px;
            color: #2c3e50;
            min-height: 40px;
            white-space: pre-wrap;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <!-- قائمة اختيار اللغة -->
        <div class="lang-selector">
            <select id="langSelect" onchange="changeLanguage()">
                <option value="ar">العربية 🇸🇦</option>
                <option value="en">English 🇬🇧</option>
                <option value="fr">Français 🇫🇷</option>
            </select>
        </div>

        <h2 id="calcTitle">📏 حاسبة فرق الارتفاع والانحدار</h2>
        
        <div class="input-group">
            <label id="labelA">الارتفاع عند النقطة أ (متر):</label>
            <input type="number" id="elevA" placeholder="مثال: 150" oninput="calculate()">
        </div>
        
        <div class="input-group">
            <label id="labelB">الارتفاع عند النقطة ب (متر):</label>
            <input type="number" id="elevB" placeholder="مثال: 111" oninput="calculate()">
        </div>
        
        <div class="input-group">
            <label id="labelDist">المسافة الأفقية بين النقطتين (متر):</label>
            <input type="number" id="distance" placeholder="مثال: 500" oninput="calculate()">
        </div>

        <div class="result-box">
            <p class="result-text"><span id="textDeniv">فرق الارتفاع (Dénivelée):</span> <span id="deniveleeResult">0</span> <span id="unitM">متر</span></p>
            <p class="result-text"><span id="textSlope">نسبة الانحدار (Pente):</span> <span id="slopeResult">0</span> %</p>
        </div>

        <!-- قسم الذكاء الاصطناعي Gemini -->
        <div class="ai-section">
            <label id="aiLabel" style="margin-bottom: 8px;">اسأل المساعد الذكي عن النتيجة:</label>
            <button class="ai-btn" id="aiButton" onclick="askGemini()">✨ تحليل النتيجة بالذكاء الاصطناعي</button>
            <div class="ai-response" id="aiResponse">اضغط على الزر ليقوم المساعد بتحليل البيانات...</div>
        </div>
    </div>

    <script>
        const translations = {
            ar: {
                title: "حاسبة الانحدار وفرق الارتفاع للأنابيب",
                heading: "📏 حاسبة فرق الارتفاع والانحدار",
                labelA: "الارتفاع عند النقطة أ (متر):",
                labelB: "الارتفاع عند النقطة ب (متر):",
                labelDist: "المسافة الأفقية بين النقطتين (متر):",
                textDeniv: "فرق الارتفاع (Dénivelée):",
                textSlope: "نسبة الانحدار (Pente):",
                unitM: "متر",
                aiLabel: "اسأل المساعد الذكي عن النتيجة:",
                aiBtn: "✨ تحليل النتيجة بالذكاء الاصطناعي",
                aiWait: "جاري تحليل النتائج وإعطاء التوصيات الهندسية...",
                dir: "rtl"
            },
            en: {
                title: "Pipe Elevation Difference & Slope Calculator",
                heading: "📏 Elevation & Slope Calculator",
                labelA: "Elevation at Point A (meters):",
                labelB: "Elevation at Point B (meters):",
                labelDist: "Horizontal Distance (meters):",
                textDeniv: "Elevation Difference:",
                textSlope: "Slope Percentage:",
                unitM: "m",
                aiLabel: "Ask AI Assistant about the result:",
                aiBtn: "✨ Analyze with AI",
                aiWait: "Analyzing results and engineering recommendations...",
                dir: "ltr"
            },
            fr: {
                title: "Calculateur de Dénivelée et Pente de Tuyauterie",
                heading: "📏 Calculateur de Dénivelée & Pente",
                labelA: "Altitude au Point A (mètres) :",
                labelB: "Altitude au Point B (mètres) :",
                labelDist: "Distance horizontale (mètres) :",
                textDeniv: "Dénivelée :",
                textSlope: "Pente :",
                unitM: "m",
                aiLabel: "Demander à l'assistant IA :",
                aiBtn: "✨ Analyser avec l'IA",
                aiWait: "Analyse des résultats et recommandations...",
                dir: "ltr"
            }
        };

        function changeLanguage() {
            let lang = document.getElementById('langSelect').value;
            let t = translations[lang];

            document.getElementById('htmlTag').setAttribute('lang', lang);
            document.getElementById('htmlTag').setAttribute('dir', t.dir);
            document.getElementById('pageTitle').innerText = t.title;
            document.getElementById('calcTitle').innerText = t.heading;
            document.getElementById('labelA').innerText = t.labelA;
            document.getElementById('labelB').innerText = t.labelB;
            document.getElementById('labelDist').innerText = t.labelDist;
            document.getElementById('textDeniv').innerText = t.textDeniv;
            document.getElementById('textSlope').innerText = t.textSlope;
            document.getElementById('unitM').innerText = t.unitM;
            document.getElementById('aiLabel').innerText = t.aiLabel;
            document.getElementById('aiButton').innerText = t.aiBtn;
        }

        function calculate() {
            let elevA = parseFloat(document.getElementById('elevA').value) || 0;
            let elevB = parseFloat(document.getElementById('elevB').value) || 0;
            let distance = parseFloat(document.getElementById('distance').value) || 0;

            let denivelee = Math.abs(elevA - elevB);
            document.getElementById('deniveleeResult').innerText = denivelee.toFixed(2);

            let slope = 0;
            if (distance > 0) {
                slope = (denivelee / distance) * 100;
                document.getElementById('slopeResult').innerText = slope.toFixed(2);
            } else {
                document.getElementById('slopeResult').innerText = "0";
            }
        }

        function askGemini() {
            let lang = document.getElementById('langSelect').value;
            let deniv = document.getElementById('deniveleeResult').innerText;
            let slope = document.getElementById('slopeResult').innerText;
            let responseBox = document.getElementById('aiResponse');

            responseBox.innerText = translations[lang].aiWait;

            // محاكاة تحليل ذكي احترافي (قريباً سنقوم بربطه بمفتاح API حقيقي لـ Gemini)
            setTimeout(() => {
                if (lang === 'ar') {
                    responseBox.innerText = `💡 تحليل ذكي: فرق الارتفاع هو ${deniv} متر بنسبة انحدار ${slope}%. هذا الانحدار مقبول هندسياً لتصريف السوائل، ويُنصح بمراجعة نقاط تثبيت الدعم للمسار.`;
                } else if (lang === 'fr') {
                    responseBox.innerText = `💡 Analyse IA : Dénivelée de ${deniv}m avec une pente de ${slope}%. Cette pente est acceptable pour l'écoulement, vérifiez les supports.`;
                } else {
                    responseBox.innerText = `💡 AI Analysis: Elevation difference is ${deniv}m with a ${slope}% slope. This slope is acceptable for fluid flow; check pipeline supports.`;
                }
            }, 1000);
        }
    </script>

</body>
</html>
