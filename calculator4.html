<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trench Excavation Volume Calculator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .calculator { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 520px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        a.back-btn { text-decoration: none; color: #2563eb; font-weight: bold; font-size: 14px; }
        select { padding: 5px 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; background: #fff; cursor: pointer; }
        h2 { text-align: center; color: #1e293b; font-size: 18px; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; color: #475569; font-weight: bold; font-size: 13px;}
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
        input:focus { border-color: #2563eb; outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .result-box { background: #f0fdf4; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: center; border: 1px solid #bbf7d0; }
        .result-text { font-size: 15px; color: #15803d; font-weight: bold; margin: 6px 0; }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="top-bar">
            <a href="index.html" class="back-btn" id="backText">← Back to Directory</a>
            <select id="langSelect" onchange="changeLanguage()">
                <option value="en">English 🇬🇧</option>
                <option value="fr">Français 🇫🇷</option>
                <option value="ar">العربية 🇸🇦</option>
            </select>
        </div>

        <h2 id="calcTitle">🚜 Trench Excavation Volume Calculator</h2>
        <div class="input-group">
            <label id="labelLength">Trench Length (meters):</label>
            <input type="number" id="trenchLength" placeholder="e.g. 100" oninput="calculateVolume()">
        </div>
        <div class="input-group">
            <label id="labelWidth">Trench Width (meters):</label>
            <input type="number" id="trenchWidth" placeholder="e.g. 1.2" oninput="calculateVolume()">
        </div>
        <div class="input-group">
            <label id="labelDepth">Trench Depth (meters):</label>
            <input type="number" id="trenchDepth" placeholder="e.g. 1.5" oninput="calculateVolume()">
        </div>
        <div class="result-box">
            <p class="result-text"><span id="textVolume">Excavation Volume:</span> <span id="volumeResult">0.00</span> <span id="unitCubic">m³</span></p>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                backText: "← Back to Directory",
                calcTitle: "🚜 Trench Excavation Volume Calculator",
                labelLength: "Trench Length (meters):",
                labelWidth: "Trench Width (meters):",
                labelDepth: "Trench Depth (meters):",
                textVolume: "Excavation Volume:",
                unitCubic: "m³",
                dir: "ltr"
            },
            fr: {
                backText: "← Retour au répertoire",
                calcTitle: "🚜 Calculateur de Volume de Tranchée",
                labelLength: "Longueur de la tranchée (mètres) :",
                labelWidth: "Largeur de la tranchée (mètres) :",
                labelDepth: "Profondeur de la tranchée (mètres) :",
                textVolume: "Volume de Déblai :",
                unitCubic: "m³",
                dir: "ltr"
            },
            ar: {
                backText: "← العودة إلى الدليل",
                calcTitle: "🚜 حاسبة حجم حفريات الخنادق",
                labelLength: "طول الخندق (متر):",
                labelWidth: "عرض الخندق (متر):",
                labelDepth: "عمق الخندق (متر):",
                textVolume: "حجم الحفريات الإجمالي:",
                unitCubic: "متر مكعب (م³)",
                dir: "rtl"
            }
        };

        function changeLanguage() {
            let lang = document.getElementById('langSelect').value;
            let t = translations[lang];
            document.getElementById('htmlTag').setAttribute('lang', lang);
            document.getElementById('htmlTag').setAttribute('dir', t.dir);
            document.getElementById('backText').innerText = t.backText;
            document.getElementById('calcTitle').innerText = t.calcTitle;
            document.getElementById('labelLength').innerText = t.labelLength;
            document.getElementById('labelWidth').innerText = t.labelWidth;
            document.getElementById('labelDepth').innerText = t.labelDepth;
            document.getElementById('textVolume').innerText = t.textVolume;
            document.getElementById('unitCubic').innerText = t.unitCubic;
        }

        function calculateVolume() {
            let L = parseFloat(document.getElementById('trenchLength').value) || 0;
            let W = parseFloat(document.getElementById('trenchWidth').value) || 0;
            let D = parseFloat(document.getElementById('trenchDepth').value) || 0;
            let volume = L * W * D;

            document.getElementById('volumeResult').innerText = volume.toFixed(2);
        }
    </script>
</body>
</html>
