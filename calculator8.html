<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steel Pipe Weight Calculator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .calculator { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 520px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        a.back-btn { text-decoration: none; color: #2563eb; font-weight: bold; font-size: 14px; }
        select { padding: 5px 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; background: #fff; cursor: pointer; }
        h2 { text-align: center; color: #1e293b; font-size: 18px; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; color: #475569; font-weight: bold; font-size: 13px;}
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
        input:focus { border-color: #2563eb; outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .result-box { background: #f8fafc; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: center; border: 1px solid #e2e8f0; }
        .result-text { font-size: 15px; color: #334155; font-weight: bold; margin: 6px 0; }
        .highlight { color: #2563eb; font-size: 18px; }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="top-bar">
            <a href="index.html" class="back-btn" id="backText">← Back to Directory</a>
            <select id="langSelect" onchange="changeLanguage()">
                <option value="en">English 🇬🇧</option>
                <option value="fr">Français 🇫🇷</option>
                <option value="ar">العربية 🇸🇦</option>
            </select>
        </div>

        <h2 id="calcTitle">pipe Ố Steel Pipe Weight Calculator</h2>
        <div class="input-group">
            <label id="labelOd">Outer Diameter - OD (mm):</label>
            <input type="number" id="pipeOd" placeholder="e.g. 219.1" oninput="calculateSteelPipe()">
        </div>
        <div class="input-group">
            <label id="labelWt">Wall Thickness - WT (mm):</label>
            <input type="number" id="pipeWt" placeholder="e.g. 8.18" oninput="calculateSteelPipe()">
        </div>
        <div class="input-group">
            <label id="labelLen">Total Length of Pipe (meters):</label>
            <input type="number" id="pipeLen" placeholder="e.g. 12" oninput="calculateSteelPipe()">
        </div>
        
        <div class="result-box">
            <p class="result-text"><span id="textUnitWeight">Weight per Meter:</span> <span id="weightPerMeter" class="highlight">0.00</span> <span id="unitKgM">kg/m</span></p>
            <p class="result-text"><span id="textTotalWeight">Total Pipe Weight:</span> <span id="totalWeight" class="highlight">0.00</span> <span id="unitKg">kg</span></p>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                backText: "← Back to Directory", calcTitle: "🔧 Steel Pipe Weight Calculator",
                labelOd: "Outer Diameter - OD (mm):", labelWt: "Wall Thickness - WT (mm):", labelLen: "Total Length of Pipe (meters):",
                textUnitWeight: "Weight per Meter:", textTotalWeight: "Total Pipe Weight:", unitKgM: "kg/m", unitKg: "kg", dir: "ltr"
            },
            fr: {
                backText: "← Retour au répertoire", calcTitle: "🔧 Calculateur de Poids de Tuyau en Acier",
                labelOd: "Diamètre Extérieur - OD (mm) :", labelWt: "Épaisseur de Paroi - WT (mm) :", labelLen: "Longueur Totale du Tuyau (mètres) :",
                textUnitWeight: "Poids par Mètre :", textTotalWeight: "Poids Total du Tuyau :", unitKgM: "kg/m", unitKg: "kg", dir: "ltr"
            },
            ar: {
                backText: "← العودة إلى الدليل", calcTitle: "🔧 حاسبة وزن الأنابيب الفولاذية",
                labelOd: "القطر الخارجي - OD (مم):", labelWt: "سماكة الجدار - WT (مم):", labelLen: "الطول الإجمالي للأنبوب (متر):",
                textUnitWeight: "الوزن لكل متر:", textTotalWeight: "إجمالي وزن الأنبوب:", unitKgM: "كجم/م", unitKg: "كجم", dir: "rtl"
            }
        };

        function changeLanguage() {
            let lang = document.getElementById('langSelect').value;
            let t = translations[lang];
            document.getElementById('htmlTag').setAttribute('lang', lang);
            document.getElementById('htmlTag').setAttribute('dir', t.dir);
            document.getElementById('backText').innerText = t.backText;
            document.getElementById('calcTitle').innerText = t.calcTitle;
            document.getElementById('labelOd').innerText = t.labelOd;
            document.getElementById('labelWt').innerText = t.labelWt;
            document.getElementById('labelLen').innerText = t.labelLen;
            document.getElementById('textUnitWeight').innerText = t.textUnitWeight;
            document.getElementById('textTotalWeight').innerText = t.textTotalWeight;
            document.getElementById('unitKgM').innerText = t.unitKgM;
            document.getElementById('unitKg').innerText = t.unitKg;
        }

        function calculateSteelPipe() {
            let OD = parseFloat(document.getElementById('pipeOd').value) || 0;
            let WT = parseFloat(document.getElementById('pipeWt').value) || 0;
            let L = parseFloat(document.getElementById('pipeLen').value) || 0;
            
            // معادلة وزن الأنبوب الفولاذي: الوزن (كجم/م) = 0.02466 * WT * (OD - WT)
            let weightPerM = 0.02466 * WT * (OD - WT);
            let totalW = weightPerM * L;

            document.getElementById('weightPerMeter').innerText = weightPerM.toFixed(2);
            document.getElementById('totalWeight').innerText = totalW.toFixed(2);
        }
    </script>
</body>
</html>
